<head>
  <meta charset="UTF-8" />

  {% seo %}
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#142420" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}"
  />
  <script>
    (function () {
      try {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if (!document.referrer) return;

        var normalize = function (pathname) {
          var path = pathname
            .replace(/\/index\.html$/, "")
            .replace(/\/index$/, "")
            .replace(/\/+$/, "");
          return path || "/";
        };

        if (normalize(location.pathname) === "/") return;

        var from = new URL(document.referrer);
        if (from.origin !== location.origin) return;
        if (normalize(from.pathname) !== "/") return;

        document.documentElement.classList.add("from-landing");
      } catch (error) {}
    })();
  </script>
</head>
